name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build (Frontend/src/ only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    env:
      VITE_ADMIN_BASE: /opclin-23410
      VITE_SUPABASE_URL: https://vardexszujcvrepiguvu.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_BLGqrC-bRgz9_3jnsxTHdQ_xx8OBZY5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Source Lint
        run: npm run lint

      - name: Check env (temporary)
        run: |
          [ -n "$VITE_SUPABASE_URL" ] && echo "URL is set" || echo "URL is EMPTY"
          [ -n "$VITE_SUPABASE_ANON_KEY" ] && echo "KEY is set" || echo "KEY is EMPTY"

      - name: Build and Prerender SSG
        run: npm run build