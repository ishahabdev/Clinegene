<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10c8e0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(16, 185, 129, 0.4)"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#061a2b"/>
  <!-- Stylized DNA Double Helix / C Symbol -->
  <g filter="url(#glow)">
    <path d="M 32 24 C 20 36 20 64 32 76 C 42 86 58 86 68 76 C 72 72 74 68 76 62" fill="none" stroke="url(#cgGrad)" stroke-width="9" stroke-linecap="round"/>
    <!-- DNA rungs -->
    <line x1="38" y1="36" x2="60" y2="36" stroke="#10c8e0" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <line x1="30" y1="50" x2="70" y2="50" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <line x1="38" y1="64" x2="60" y2="64" stroke="#059669" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <!-- Center node -->
    <circle cx="50" cy="50" r="5.5" fill="#ffffff"/>
    <circle cx="66" cy="34" r="4.5" fill="#10c8e0"/>
    <circle cx="66" cy="66" r="4.5" fill="#10b981"/>
  </g>
</svg>