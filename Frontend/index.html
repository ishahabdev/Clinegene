<!doctype html>
<html lang="en" data-theme="cyan">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061a2b" />

    <!-- Synchronous Theme Initializer: Runs before HTML paint to prevent FOUC / theme flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('clingene-theme');
          var theme = (saved === 'red' || saved === 'green' || saved === 'cyan') ? saved : (saved === 'blue' ? 'cyan' : 'cyan');
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'cyan');
        }
      })();
    </script>
    <title>ClinGene | Clinical Genetic Testing Laboratory</title>
    <meta
      name="description"
      content="ClinGene provides genetic testing, Sanger sequencing, NGS, and bioinformatics services for researchers, clinicians and industry partners in Islamabad, Pakistan."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.clingene.co/" />

    <!-- Site Name for Google (static, must stay in this file, not injected by React) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ClinGene",
        "alternateName": ["ClinGene Pakistan", "Clingene"],
        "url": "https://www.clingene.co/"
      }
    </script>

    <!-- Google-compliant Favicons -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="48x48" />
    <link rel="icon" href="/favicon.svg?v=3" sizes="any" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClinGene" />
    <meta property="og:title" content="ClinGene | Clinical Genetic Testing Laboratory" />
    <meta
      property="og:description"
      content="ClinGene provides genetic testing, Sanger sequencing, NGS, and bioinformatics services for researchers, clinicians and industry partners in Islamabad, Pakistan."
    />
    <meta property="og:url" content="https://www.clingene.co/" />
    <meta property="og:image" content="https://www.clingene.co/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ClinGene - Precision Genomics and Genetic Testing Laboratory" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClinGene | Clinical Genetic Testing Laboratory" />
    <meta
      name="twitter:description"
      content="ClinGene provides genetic testing, Sanger sequencing, NGS, and bioinformatics services for researchers, clinicians and industry partners in Islamabad, Pakistan."
    />
    <meta name="twitter:image" content="https://www.clingene.co/images/og-image.jpg" />

    <!-- Google Fonts with display=swap and non-render-blocking media trick -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
